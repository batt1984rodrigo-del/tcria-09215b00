name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (critical errors)
        run: |
          python -m compileall -q tcria

      - name: Run tests
        run: |
          pytest -q

      - name: Build Docker image (MCP)
        run: |
          docker build -f Dockerfile.mcp -t tcria:mcp-ci .

      - name: Smoke API container
        run: |
          docker run -d --rm -p 8000:8000 --name tcria_api_ci tcria:mcp-ci
          sleep 5
          curl -fsS http://127.0.0.1:8000/health
          docker stop tcria_api_ci
