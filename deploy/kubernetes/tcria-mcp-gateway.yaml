apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcria-mcp-gateway
  labels:
    app: tcria-mcp-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tcria-mcp-gateway
  template:
    metadata:
      labels:
        app: tcria-mcp-gateway
    spec:
      containers:
        - name: gateway
          image: tcria-mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TCRIA_MCP_REQUIRE_AUTH
              value: "true"
            - name: TCRIA_MCP_PUBLIC_URL
              value: "https://tcria.example.com/mcp"
            - name: TCRIA_MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tcria-mcp-secrets
                  key: jwt-secret
            - name: TCRIA_MCP_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: tcria-mcp-secrets
                  key: signing-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tcria-mcp-gateway
spec:
  selector:
    app: tcria-mcp-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
